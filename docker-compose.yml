version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: tradesage-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - client
      - api
    networks:
      - tradesage-net

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: tradesage-client
    networks:
      - tradesage-net
    # Port mapping is omitted, NGINX handles it

  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: tradesage-api
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      # Add other vars here...
    networks:
      - tradesage-net
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: tradesage-worker
    command: ["node", "workers/index.js"] # Assuming we separate worker entrypoint, or it runs via a script
    environment:
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - tradesage-net
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: tradesage-redis
    ports:
      - "6379:6379"
    networks:
      - tradesage-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  tradesage-net:
    driver: bridge
